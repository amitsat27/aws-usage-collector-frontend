      <!-- Display AWS resource data or loading state -->
      <div *ngIf="loading" class="loading-state">
        <mat-spinner></mat-spinner>
        <p>Loading AWS resources...</p>
      </div>

      <!-- Display AWS Resource Data -->
      <div *ngIf="!loading && rowData.length > 0">
        <div
          class="ag-theme-alpine"
          style="height: 400px; width: 100%; margin-top: 20px"
        >
          <ag-grid-angular
            [columnDefs]="
              selectedOption === 's3'
                ? columnDefsS3
                : selectedOption === 'ebs'
                ? columnDefsEBS
                : columnDefsEC2
            "
            [rowData]="rowData"
            [modules]="modules"
            [domLayout]="'autoHeight'"
            class="ag-theme-alpine"
            (firstDataRendered)="onResize()"
            (gridSizeChanged)="onResize()"
            (gridReady)="onGridReady($event)"
          >
          </ag-grid-angular>
        </div>
      </div>

      <!-- No data available -->
      <div *ngIf="!loading && rowData.length === 0" class="no-data">
        <p>No data available for the selected resource type.</p>
      </div>
    </mat-card>
  </mat-tab>

        </mat-card-title>
